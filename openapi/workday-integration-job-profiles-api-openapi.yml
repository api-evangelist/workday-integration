openapi: 3.2.0
info:
  title: Workday Integration Workday Staffing Job Profiles API
  description: API for managing staffing transactions including hires, terminations, transfers, and position management. Provides programmatic access to job profiles, positions, and organizational assignments.
  version: v1
  contact:
    name: Workday API Support
    email: api-support@workday.com
    url: https://community.workday.com
  license:
    name: Proprietary
    url: https://www.workday.com/en-us/legal/site-terms.html
servers:
- url: https://{baseUrl}/ccx/api/staffing/v1/{tenant}
  description: Workday Staffing REST API server
  variables:
    baseUrl:
      default: wd2-impl-services1.workday.com
    tenant:
      default: tenant
security:
- OAuth2:
  - r:staffing
  - w:staffing
tags:
- name: Job Profiles
paths:
  /jobProfiles:
    get:
      operationId: getJobProfiles
      summary: Workday Integration Retrieve job profiles
      description: Returns a collection of job profiles configured in the tenant.
      tags:
      - Job Profiles
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/search'
      responses:
        '200':
          description: Successful response with job profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobProfilesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /jobProfiles/{ID}:
    get:
      operationId: getJobProfileById
      summary: Workday Integration Retrieve a specific job profile
      description: Returns the specified job profile with its details and qualifications.
      tags:
      - Job Profiles
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Successful response with the job profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    search:
      name: search
      in: query
      schema:
        type: string
    ID:
      name: ID
      in: path
      required: true
      schema:
        type: string
    limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
  schemas:
    ResourceReference:
      type: object
      properties:
        id:
          type: string
        descriptor:
          type: string
        href:
          type: string
          format: uri
    JobProfile:
      type: object
      properties:
        id:
          type: string
        descriptor:
          type: string
        jobProfileName:
          type: string
        jobFamily:
          $ref: '#/components/schemas/ResourceReference'
        managementLevel:
          $ref: '#/components/schemas/ResourceReference'
        isActive:
          type: boolean
    JobProfilesResponse:
      type: object
      properties:
        total:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/JobProfile'
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
  responses:
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://{baseUrl}/authorize
          tokenUrl: https://{baseUrl}/oauth2/{tenant}/token
          scopes:
            r:staffing: Read staffing data
            w:staffing: Write staffing data
