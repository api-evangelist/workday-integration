openapi: 3.1.0
info:
  title: Workday Integration Workday Absence Management Absence Types Pay Groups API
  description: API for managing employee leave requests, absence types, and time-off balances. Retrieves eligible absence types for employees and supports validation of leave category selections.
  version: v1
  contact:
    name: Workday API Support
    email: api-support@workday.com
    url: https://community.workday.com
  license:
    name: Proprietary
    url: https://www.workday.com/en-us/legal/site-terms.html
servers:
- url: https://{baseUrl}/ccx/api/absenceManagement/v1/{tenant}
  description: Workday Absence Management REST API server
  variables:
    baseUrl:
      default: wd2-impl-services1.workday.com
      description: The Workday data center hostname
    tenant:
      default: tenant
      description: The Workday tenant name
security:
- OAuth2:
  - r:absenceManagement
  - w:absenceManagement
tags:
- name: Pay Groups
paths:
  /payGroups:
    get:
      operationId: getPayGroups
      summary: Workday Integration Retrieve a collection of pay groups
      description: Returns a collection of pay groups configured in the tenant, which define payroll processing schedules and parameters.
      tags:
      - Pay Groups
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Successful response with pay groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayGroupsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /payGroups/{ID}:
    get:
      operationId: getPayGroupById
      summary: Workday Integration Retrieve a specific pay group
      description: Returns the specified pay group including its configuration and schedule.
      tags:
      - Pay Groups
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Successful response with the pay group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayGroup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /payGroupDetails:
    get:
      operationId: getPayGroupDetails
      summary: Workday Integration Retrieve pay group details
      description: Returns detailed pay group information including pay period dates and processing status.
      tags:
      - Pay Groups
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Successful response with pay group details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayGroupDetailsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /payGroupDetails/{ID}:
    get:
      operationId: getPayGroupDetailById
      summary: Workday Integration Retrieve specific pay group detail
      description: Returns the pay group detail for the specified ID.
      tags:
      - Pay Groups
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Successful response with pay group detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayGroupDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /jobs/{ID}/payGroup:
    get:
      operationId: getPayGroupForJob
      summary: Workday Integration Retrieve the pay group for a job
      description: Returns the pay group assignment for the specified job.
      tags:
      - Pay Groups
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Successful response with the job pay group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayGroup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    PayGroupDetailsResponse:
      type: object
      properties:
        total:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/PayGroupDetail'
    PayGroup:
      type: object
      properties:
        id:
          type: string
        descriptor:
          type: string
        payGroupName:
          type: string
        frequency:
          $ref: '#/components/schemas/ResourceReference'
        country:
          $ref: '#/components/schemas/ResourceReference'
    ResourceReference:
      type: object
      properties:
        id:
          type: string
        descriptor:
          type: string
        href:
          type: string
          format: uri
    PayGroupDetail:
      type: object
      properties:
        id:
          type: string
        descriptor:
          type: string
        payGroup:
          $ref: '#/components/schemas/ResourceReference'
        payPeriodStartDate:
          type: string
          format: date
        payPeriodEndDate:
          type: string
          format: date
        paymentDate:
          type: string
          format: date
        status:
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              error:
                type: string
              field:
                type: string
              message:
                type: string
    PayGroupsResponse:
      type: object
      properties:
        total:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/PayGroup'
  responses:
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    offset:
      name: offset
      in: query
      description: The zero-based index of the first object in a response collection
      schema:
        type: integer
        default: 0
    ID:
      name: ID
      in: path
      required: true
      description: The Workday ID of the resource
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: The maximum number of objects in a single response (default 20, maximum 100)
      schema:
        type: integer
        default: 20
        maximum: 100
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://{baseUrl}/authorize
          tokenUrl: https://{baseUrl}/oauth2/{tenant}/token
          refreshUrl: https://{baseUrl}/oauth2/{tenant}/token
          scopes:
            r:absenceManagement: Read absence data
            w:absenceManagement: Write absence data
