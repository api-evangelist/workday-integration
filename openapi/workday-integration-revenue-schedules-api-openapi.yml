openapi: 3.2.0
info:
  title: Workday Integration Workday Revenue Management Revenue…
  description: API for revenue recognition, billing, and revenue reporting. Provides programmatic access to revenue schedules, contracts, and billing operations.
  version: v1
  contact:
    name: Workday API Support
    email: api-support@workday.com
    url: https://community.workday.com
  license:
    name: Proprietary
    url: https://www.workday.com/en-us/legal/site-terms.html
servers:
- url: https://{baseUrl}/ccx/api/revenueManagement/v1/{tenant}
  description: Workday Revenue Management REST API server
  variables:
    baseUrl:
      default: wd2-impl-services1.workday.com
    tenant:
      default: tenant
security:
- OAuth2:
  - r:revenueManagement
tags:
- name: Revenue Schedules
paths:
  /revenueSchedules:
    get:
      operationId: getRevenueSchedules
      summary: Workday Integration Retrieve revenue schedules
      description: Returns a collection of revenue recognition schedules.
      tags:
      - Revenue Schedules
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Successful response with revenue schedules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
  schemas:
    CollectionResponse:
      type: object
      properties:
        total:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/ResourceInstance'
    ResourceInstance:
      type: object
      properties:
        id:
          type: string
        descriptor:
          type: string
        href:
          type: string
          format: uri
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://{baseUrl}/authorize
          tokenUrl: https://{baseUrl}/oauth2/{tenant}/token
          scopes:
            r:revenueManagement: Read revenue management data
