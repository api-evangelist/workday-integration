openapi: 3.2.0
info:
  title: Workday Integration Workers API
  version: v1
  contact:
    name: Workday API Support
    email: api-support@workday.com
    url: https://community.workday.com
  license:
    name: Proprietary
    url: https://www.workday.com/en-us/legal/site-terms.html
  description: 'Operations tagged Workers across 2 of this provider''s published API definitions: workday-integration-human-capital-management-openapi.yml, workday-integration-staffing-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{baseUrl}/ccx/api/v1/{tenant}
  description: Workday REST API server
  variables:
    baseUrl:
      default: wd2-impl-services1.workday.com
      description: The Workday data center hostname
    tenant:
      default: tenant
      description: The Workday tenant name
- url: https://{baseUrl}/ccx/api/staffing/v1/{tenant}
  description: Workday Staffing REST API server
  variables:
    baseUrl:
      default: wd2-impl-services1.workday.com
    tenant:
      default: tenant
tags:
- name: Workers
paths:
  /workers:
    get:
      operationId: getWorkers
      summary: Workday Integration Retrieve a collection of workers
      description: Returns a collection of workers and current staffing information. Supports pagination, search, and filtering by various criteria.
      tags:
      - Workers
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/search'
      responses:
        '200':
          description: Successful response with a collection of workers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - OAuth2:
        - r:workers
        - w:workers
    servers:
    - url: https://{baseUrl}/ccx/api/v1/{tenant}
      description: Workday REST API server
      variables:
        baseUrl:
          default: wd2-impl-services1.workday.com
          description: The Workday data center hostname
        tenant:
          default: tenant
          description: The Workday tenant name
  /workers/{ID}:
    get:
      operationId: getWorkerById
      summary: Workday Integration Retrieve a single worker instance
      description: Returns the specified worker including personal data, employment information, and organizational assignments.
      tags:
      - Workers
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Successful response with the worker instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worker'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - OAuth2:
        - r:workers
        - w:workers
    servers:
    - url: https://{baseUrl}/ccx/api/v1/{tenant}
      description: Workday REST API server
      variables:
        baseUrl:
          default: wd2-impl-services1.workday.com
          description: The Workday data center hostname
        tenant:
          default: tenant
          description: The Workday tenant name
  /workers/{ID}/organizations:
    get:
      operationId: getWorkerOrganizations
      summary: Workday Integration Retrieve organizations for a worker
      description: Returns the organizational memberships for the specified worker, including supervisory organizations and cost centers.
      tags:
      - Workers
      parameters:
      - $ref: '#/components/parameters/ID'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
