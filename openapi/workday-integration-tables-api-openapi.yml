openapi: 3.2.0
info:
  title: Workday Integration Workday Prism Analytics Tables API
  description: REST API for working with Workday Prism Analytics tables, data change tasks, and datasets. Enables programmatic creation of Prism Analytics tables and datasets and modification of data within them.
  version: v3
  contact:
    name: Workday API Support
    email: api-support@workday.com
    url: https://community.workday.com
  license:
    name: Proprietary
    url: https://www.workday.com/en-us/legal/site-terms.html
servers:
- url: https://{baseUrl}/ccx/api/prismAnalytics/v3/{tenant}
  description: Workday Prism Analytics REST API server
  variables:
    baseUrl:
      default: wd2-impl-services1.workday.com
    tenant:
      default: tenant
security:
- OAuth2:
  - r:prismAnalytics
  - w:prismAnalytics
tags:
- name: Tables
paths:
  /tables:
    get:
      operationId: getTables
      summary: Workday Integration Retrieve Prism Analytics tables
      description: Returns a collection of Prism Analytics tables in the tenant.
      tags:
      - Tables
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/search'
      responses:
        '200':
          description: Successful response with tables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TablesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createTable
      summary: Workday Integration Create a Prism Analytics table
      description: Creates a new Prism Analytics table with the specified schema.
      tags:
      - Tables
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableRequest'
      responses:
        '201':
          description: Table created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tables/{ID}:
    get:
      operationId: getTableById
      summary: Workday Integration Retrieve a specific Prism Analytics table
      description: Returns the specified Prism Analytics table with its schema definition.
      tags:
      - Tables
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Successful response with the table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateTable
      summary: Workday Integration Update a Prism Analytics table
      description: Updates the specified Prism Analytics table schema.
      tags:
      - Tables
      parameters:
      - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableRequest'
      responses:
        '200':
          description: Table updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteTable
      summary: Workday Integration Delete a Prism Analytics table
      description: Deletes the specified Prism Analytics table and its data.
      tags:
      - Tables
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Table deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    search:
      name: search
      in: query
      schema:
        type: string
    ID:
      name: ID
      in: path
      required: true
      schema:
        type: string
    limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Table:
      type: object
      properties:
        id:
          type: string
        descriptor:
          type: string
        displayName:
          type: string
        enableForAnalysis:
          type: boolean
        fields:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              ordinal:
                type: integer
              type:
                type: object
                properties:
                  id:
                    type: string
                  descriptor:
                    type: string
              parseFormat:
                type: string
              precision:
                type: integer
              scale:
                type: integer
    ResourceReference:
      type: object
      properties:
        id:
          type: string
        descriptor:
          type: string
        href:
          type: string
          format: uri
    TableRequest:
      type: object
      required:
      - displayName
      - fields
      properties:
        displayName:
          type: string
        enableForAnalysis:
          type: boolean
        fields:
          type: array
          items:
            type: object
            required:
            - name
            - type
            properties:
              name:
                type: string
              description:
                type: string
              ordinal:
                type: integer
              type:
                $ref: '#/components/schemas/ResourceReference'
    TablesResponse:
      type: object
      properties:
        total:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/Table'
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://{baseUrl}/authorize
          tokenUrl: https://{baseUrl}/oauth2/{tenant}/token
          scopes:
            r:prismAnalytics: Read Prism Analytics data
            w:prismAnalytics: Write Prism Analytics data
