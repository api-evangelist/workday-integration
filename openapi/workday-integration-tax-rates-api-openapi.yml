openapi: 3.1.0
info:
  title: Workday Integration Workday Absence Management Absence Types Tax Rates API
  description: API for managing employee leave requests, absence types, and time-off balances. Retrieves eligible absence types for employees and supports validation of leave category selections.
  version: v1
  contact:
    name: Workday API Support
    email: api-support@workday.com
    url: https://community.workday.com
  license:
    name: Proprietary
    url: https://www.workday.com/en-us/legal/site-terms.html
servers:
- url: https://{baseUrl}/ccx/api/absenceManagement/v1/{tenant}
  description: Workday Absence Management REST API server
  variables:
    baseUrl:
      default: wd2-impl-services1.workday.com
      description: The Workday data center hostname
    tenant:
      default: tenant
      description: The Workday tenant name
security:
- OAuth2:
  - r:absenceManagement
  - w:absenceManagement
tags:
- name: Tax Rates
paths:
  /companySUIRates:
    get:
      operationId: getCompanySUIRates
      summary: Workday Integration Retrieve company SUI rates
      description: Returns company state unemployment insurance rates.
      tags:
      - Tax Rates
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Successful response with SUI rates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SUIRatesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createCompanySUIRate
      summary: Workday Integration Create a company SUI rate
      description: Creates a new state unemployment insurance rate entry.
      tags:
      - Tax Rates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SUIRateRequest'
      responses:
        '201':
          description: SUI rate created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SUIRate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  responses:
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    SUIRateRequest:
      type: object
      required:
      - company
      - state
      - rate
      - effectiveDate
      properties:
        company:
          $ref: '#/components/schemas/ResourceReference'
        state:
          $ref: '#/components/schemas/ResourceReference'
        rate:
          type: number
        effectiveDate:
          type: string
          format: date
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              error:
                type: string
              field:
                type: string
              message:
                type: string
    ResourceReference:
      type: object
      properties:
        id:
          type: string
        descriptor:
          type: string
        href:
          type: string
          format: uri
    SUIRate:
      type: object
      properties:
        id:
          type: string
        descriptor:
          type: string
        company:
          $ref: '#/components/schemas/ResourceReference'
        state:
          $ref: '#/components/schemas/ResourceReference'
        rate:
          type: number
        effectiveDate:
          type: string
          format: date
    SUIRatesResponse:
      type: object
      properties:
        total:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/SUIRate'
  parameters:
    offset:
      name: offset
      in: query
      description: The zero-based index of the first object in a response collection
      schema:
        type: integer
        default: 0
    limit:
      name: limit
      in: query
      description: The maximum number of objects in a single response (default 20, maximum 100)
      schema:
        type: integer
        default: 20
        maximum: 100
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://{baseUrl}/authorize
          tokenUrl: https://{baseUrl}/oauth2/{tenant}/token
          refreshUrl: https://{baseUrl}/oauth2/{tenant}/token
          scopes:
            r:absenceManagement: Read absence data
            w:absenceManagement: Write absence data
