openapi: 3.2.0
info:
  title: Workday Integration Workday Performance Management…
  description: API for managing employee performance reviews, goals, and feedback. Supports performance review cycles, feedback badge management, and goal tracking across the organization.
  version: v1
  contact:
    name: Workday API Support
    email: api-support@workday.com
    url: https://community.workday.com
  license:
    name: Proprietary
    url: https://www.workday.com/en-us/legal/site-terms.html
servers:
- url: https://{baseUrl}/ccx/api/performanceManagement/v1/{tenant}
  description: Workday Performance Management REST API server
  variables:
    baseUrl:
      default: wd2-impl-services1.workday.com
    tenant:
      default: tenant
security:
- OAuth2:
  - r:performanceManagement
tags:
- name: Performance Reviews
paths:
  /workers/{ID}/performanceReviews:
    get:
      operationId: getWorkerPerformanceReviews
      summary: Workday Integration Retrieve performance reviews for a worker
      description: Returns the performance review records for the specified worker.
      tags:
      - Performance Reviews
      parameters:
      - $ref: '#/components/parameters/ID'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Successful response with performance reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceReviewsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    PerformanceReviewsResponse:
      type: object
      properties:
        total:
          type: integer
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              descriptor:
                type: string
              reviewPeriod:
                type: string
              overallRating:
                type: string
              manager:
                $ref: '#/components/schemas/ResourceReference'
              completionDate:
                type: string
                format: date
    ResourceReference:
      type: object
      properties:
        id:
          type: string
        descriptor:
          type: string
        href:
          type: string
          format: uri
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
  parameters:
    ID:
      name: ID
      in: path
      required: true
      schema:
        type: string
    limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://{baseUrl}/authorize
          tokenUrl: https://{baseUrl}/oauth2/{tenant}/token
          scopes:
            r:performanceManagement: Read performance data
