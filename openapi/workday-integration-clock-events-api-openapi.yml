openapi: 3.2.0
info:
  title: Workday Integration Workday Time Tracking Clock Events API
  description: API for time entry, attendance, absence management, and scheduling. Supports clock events, time block management, time review events, and validation of worker time records.
  version: v1
  contact:
    name: Workday API Support
    email: api-support@workday.com
    url: https://community.workday.com
  license:
    name: Proprietary
    url: https://www.workday.com/en-us/legal/site-terms.html
servers:
- url: https://{baseUrl}/ccx/api/timeTracking/v1/{tenant}
  description: Workday Time Tracking REST API server
  variables:
    baseUrl:
      default: wd2-impl-services1.workday.com
      description: The Workday data center hostname
    tenant:
      default: tenant
      description: The Workday tenant name
security:
- OAuth2:
  - r:timeTracking
  - w:timeTracking
tags:
- name: Clock Events
paths:
  /timeClockEvents:
    post:
      operationId: createTimeClockEvent
      summary: Workday Integration Create a time clock event
      description: Records a time clock event such as a clock-in or clock-out for a worker.
      tags:
      - Clock Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeClockEventRequest'
      responses:
        '201':
          description: Time clock event created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeClockEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              error:
                type: string
              field:
                type: string
              message:
                type: string
    TimeClockEvent:
      type: object
      properties:
        id:
          type: string
        descriptor:
          type: string
        worker:
          $ref: '#/components/schemas/ResourceReference'
        eventType:
          type: string
          enum:
          - Clock_In
          - Clock_Out
        eventDateTime:
          type: string
          format: date-time
        timeZone:
          type: string
    TimeClockEventRequest:
      type: object
      required:
      - worker
      - eventType
      - eventDateTime
      properties:
        worker:
          $ref: '#/components/schemas/ResourceReference'
        eventType:
          type: string
          enum:
          - Clock_In
          - Clock_Out
        eventDateTime:
          type: string
          format: date-time
        timeZone:
          type: string
    ResourceReference:
      type: object
      properties:
        id:
          type: string
        descriptor:
          type: string
        href:
          type: string
          format: uri
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://{baseUrl}/authorize
          tokenUrl: https://{baseUrl}/oauth2/{tenant}/token
          refreshUrl: https://{baseUrl}/oauth2/{tenant}/token
          scopes:
            r:timeTracking: Read time tracking data
            w:timeTracking: Write time tracking data
