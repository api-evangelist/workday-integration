openapi: 3.2.0
info:
  title: Workday Integration Workday Prism Analytics File Containers…
  description: REST API for working with Workday Prism Analytics tables, data change tasks, and datasets. Enables programmatic creation of Prism Analytics tables and datasets and modification of data within them.
  version: v3
  contact:
    name: Workday API Support
    email: api-support@workday.com
    url: https://community.workday.com
  license:
    name: Proprietary
    url: https://www.workday.com/en-us/legal/site-terms.html
servers:
- url: https://{baseUrl}/ccx/api/prismAnalytics/v3/{tenant}
  description: Workday Prism Analytics REST API server
  variables:
    baseUrl:
      default: wd2-impl-services1.workday.com
    tenant:
      default: tenant
security:
- OAuth2:
  - r:prismAnalytics
  - w:prismAnalytics
tags:
- name: File Containers
paths:
  /fileContainers:
    post:
      operationId: createFileContainer
      summary: Workday Integration Create a file container for data upload
      description: Creates a file container for uploading data files to be processed by a data change task.
      tags:
      - File Containers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileContainerRequest'
      responses:
        '201':
          description: File container created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileContainer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /fileContainers/{ID}:
    get:
      operationId: getFileContainerById
      summary: Workday Integration Retrieve a specific file container
      description: Returns the specified file container with its upload status.
      tags:
      - File Containers
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Successful response with the file container
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileContainer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    ID:
      name: ID
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    FileContainerRequest:
      type: object
      properties:
        name:
          type: string
    FileContainer:
      type: object
      properties:
        id:
          type: string
        descriptor:
          type: string
        status:
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://{baseUrl}/authorize
          tokenUrl: https://{baseUrl}/oauth2/{tenant}/token
          scopes:
            r:prismAnalytics: Read Prism Analytics data
            w:prismAnalytics: Write Prism Analytics data
